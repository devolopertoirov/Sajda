name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Barcha ZIP fayllarni ochish
        run: |
          ls -la *.zip
          mkdir unzipped
          for z in *.zip; do unzip -q -o "$z" -d unzipped; done
          ROOT=$(dirname "$(find unzipped -name settings.gradle.kts | head -n 1)")
          echo "Loyiha papkasi: $ROOT"
          echo "Qur'on sahifalari:"; find "$ROOT" -name "*.webp" | wc -l
          echo "ROOT=$ROOT" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: APK yig'ish
        run: |
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TasbehDuo-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
